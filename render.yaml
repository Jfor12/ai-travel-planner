services:
  - type: web
    name: ai-travel-planner-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Optional. Enables the admin-only endpoints (edit/delete trips, init-db)
      # when sent as the X-Admin-Token header. Leave unset to keep them off.
      - key: ADMIN_TOKEN
        sync: false
